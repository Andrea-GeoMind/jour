<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jour">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Jour</title>
<style>
/* Système iOS : fond groupé, listes blanches, séparateurs fins, accent bleu. Aucune animation. */
:root{
  --bg:#F2F2F7;--group:#FFFFFF;--sep:rgba(60,60,67,.29);--label:#000;--sec:rgba(60,60,67,.6);--ter:rgba(60,60,67,.3);
  --blue:#007AFF;--green:#34C759;--red:#FF3B30;--orange:#FF9500;--gray:#8E8E93;--cal:#5E5CE6;--imp:#32ADE6;--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);
  --bar:rgba(249,249,249,.94);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000;--group:#1C1C1E;--sep:rgba(84,84,88,.65);--label:#fff;--sec:rgba(235,235,245,.6);--ter:rgba(235,235,245,.3);
  --blue:#0A84FF;--green:#30D158;--red:#FF453A;--orange:#FF9F0A;--gray:#8E8E93;--cal:#7D7AFF;--imp:#64D2FF;--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.32);
  --bar:rgba(29,29,31,.94);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--label);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;background:none;border:0;outline:none;-webkit-appearance:none;appearance:none}
button{cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}

/* Barre de navigation */
.navbar{flex:none;padding:calc(env(safe-area-inset-top) + 6px) 16px 8px;background:var(--bar);border-bottom:.5px solid var(--sep);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:calc(env(safe-area-inset-top) + 44px)}
.navbar .l{justify-self:start}.navbar .r{justify-self:end}
.navbar .t{font-size:17px;font-weight:600;text-align:center;white-space:nowrap}
.navbar .nb{color:var(--blue);font-size:17px;padding:6px 0;display:flex;align-items:center;gap:2px}
.navbar .nb.b:before{content:"";display:inline-block;width:10px;height:10px;border-left:2px solid var(--blue);border-bottom:2px solid var(--blue);transform:rotate(45deg);margin-right:4px}
.big{padding:6px 16px 10px;font-size:34px;font-weight:700;letter-spacing:-.3px;line-height:1.1}
.big small{display:block;font-size:15px;font-weight:400;color:var(--sec);letter-spacing:0;margin-top:2px}

/* Contenu */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px}
.view{display:none}.view.on{display:block}
.pg{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:5}
.pg.on{display:flex}
body{position:relative}

/* Listes groupées */
.hd{font-size:13px;color:var(--sec);text-transform:uppercase;letter-spacing:.02em;padding:22px 16px 7px}
.ft{font-size:13px;color:var(--sec);padding:7px 16px 0;line-height:1.35}
.grp{background:var(--group);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;min-height:44px;padding:0 16px;gap:12px;position:relative;width:100%;text-align:left;color:var(--label)}
.row+.row:before,.row+.a:before,.a+.row:before{content:"";position:absolute;left:16px;right:0;top:0;border-top:.5px solid var(--sep)}
.row.ins+.row:before{left:60px}
.row .lab{flex:1;min-width:0;padding:11px 0}
.row .lab .s{display:block;font-size:15px;color:var(--sec);margin-top:1px}
.row .val{color:var(--sec);flex:none;max-width:55%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{flex:none;width:8px;height:8px;border-right:1.5px solid var(--ter);border-top:1.5px solid var(--ter);transform:rotate(45deg);margin-left:-2px}
.row input[type=text],.row input[type=number],.row input[type=time],.row input[type=date]{flex:1;text-align:right;color:var(--label);min-width:0;padding:11px 0;height:44px;text-overflow:ellipsis}
.row input[type=time],.row input[type=date]{flex:none;width:auto;text-align:right}
.row input::placeholder{color:var(--ter)}
.row.act{color:var(--blue);justify-content:center}
.row.act.l{justify-content:flex-start}
.row.act.red{color:var(--red)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.sw{flex:none;width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16)}
.sw.on{background:var(--green)}.sw.on:after{left:22px}
.chk{flex:none;width:20px;color:var(--blue);font-weight:600;text-align:center}
.empty{color:var(--sec);text-align:center;padding:40px 16px;font-size:15px}

/* Jour : liste type Calendrier */
.dnav{display:flex;align-items:center;justify-content:space-between;padding:10px 0 4px}
.dnav .d{font-size:17px;font-weight:600;text-transform:capitalize}
.dnav button{color:var(--blue);padding:6px 8px;font-size:17px}
.sum{font-size:15px;color:var(--sec);padding:0 0 12px}
.ev{display:flex;align-items:stretch;min-height:52px;padding:0 16px 0 0;position:relative;width:100%;text-align:left;color:var(--label)}
.ev+.ev:before{content:"";position:absolute;left:78px;right:0;top:0;border-top:.5px solid var(--sep)}
.ev .tm{width:66px;flex:none;padding:9px 0 9px 16px;font-size:15px;color:var(--sec);line-height:1.25}
.ev .tm b{display:block;font-weight:600;color:var(--label)}
.ev .bar{width:4px;border-radius:2px;flex:none;margin:9px 10px 9px 0;background:var(--gray)}
.ev .bd{flex:1;min-width:0;padding:9px 0}
.ev .bd .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .bd .s{font-size:15px;color:var(--sec)}
.ev.fx .bd .n{font-weight:400;color:var(--sec)}
.ev.cal .bd .n{font-weight:600;color:var(--label)}
.ev.cal .bar{background:var(--cal)}
.ev.imp .bar{background:var(--imp)}
.ev.imp .bd .n{font-weight:600;color:var(--label)}
.ev .st{flex:none;align-self:center;font-size:15px;font-weight:500}
.st.done{color:var(--green)}.st.skip{color:var(--red)}.st.ask{color:var(--orange)}.st.cur{color:var(--blue)}
.now{display:flex;align-items:center;height:1px;background:var(--red);margin:0 0 0 72px;position:relative}
.now:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);position:absolute;left:-4px}

/* Bilan */
.meter{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;display:flex;margin-top:6px}
.meter i{display:block;height:100%}.meter .d{background:var(--green)}.meter .k{background:var(--red)}

/* Saisie */
.inbar{flex:none;background:var(--bar);border-top:.5px solid var(--sep);padding:8px 16px}
.inbar form{display:flex;gap:8px;align-items:center}
.inbar input{flex:1;height:36px;border-radius:18px;background:var(--fill);padding:0 14px;color:var(--label)}
.inbar input::placeholder{color:var(--sec)}
.inbar form button{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;font-size:20px;font-weight:600;line-height:36px;flex:none}
.conf{display:none;margin-bottom:8px;background:var(--group);border-radius:10px;overflow:hidden}
.conf.on{display:block}
.conf p{padding:12px 16px;font-size:15px}
.conf .bt{display:flex;border-top:.5px solid var(--sep)}
.conf .bt button{flex:1;height:44px;color:var(--blue)}
.conf .bt button+button{border-left:.5px solid var(--sep);font-weight:600}

/* Onglets */
.tabs{flex:none;display:flex;background:var(--bar);border-top:.5px solid var(--sep);padding:6px 0 calc(env(safe-area-inset-bottom) + 4px)}
.tabs button{flex:1;color:var(--gray);font-size:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0}
.tabs button.on{color:var(--blue)}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Feuille d'actions */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:20;padding:0 8px calc(env(safe-area-inset-bottom) + 8px)}
.sheet.on{display:flex}
.sheet .in{width:100%}
.sheet .g{background:var(--group);border-radius:13px;overflow:hidden;margin-bottom:8px}
.sheet .g .h{padding:12px 16px;font-size:13px;color:var(--sec);text-align:center;border-bottom:.5px solid var(--sep)}
.sheet .g button{display:block;width:100%;height:56px;font-size:20px;color:var(--blue);text-align:center}
.sheet .g button+button{border-top:.5px solid var(--sep)}
.sheet .g button.red{color:var(--red)}.sheet .g button.b{font-weight:600}

/* Bandeau d'information (pas d'animation) */
.note{display:none;background:var(--group);border-bottom:.5px solid var(--sep);padding:10px 16px;font-size:15px;color:var(--sec);text-align:center}
.note.on{display:block}
</style>
</head>
<body>
<div class="navbar"><div class="l"></div><div class="t" id="ttl">Jour</div><div class="r"><button class="nb" id="gbtn" onclick="onChip()"></button></div></div>
<div class="note" id="note"></div>
<main id="main">
  <section class="view on" id="v-jour">
    <div class="dnav"><button onclick="moveDay(-1)">‹</button><div class="d" id="dlabel"></div><button onclick="moveDay(1)">›</button></div>
    <div class="sum tnum" id="dmeta"></div>
    <div class="grp" id="tl"></div>
    <div class="ft" id="dfoot"></div>
  </section>
  <section class="view" id="v-semaine"><div id="wk"></div></section>
  <section class="view" id="v-bilan"><div id="bilan"></div></section>
  <section class="view" id="v-reglages"><div id="reg"></div></section>
</main>
<div class="inbar" id="inbar">
  <div class="conf" id="confirm"><p id="ctext"></p><div class="bt"><button onclick="cancelAction()">Annuler</button><button onclick="applyAction()">Valider</button></div></div>
  <form onsubmit="return onDictate(event)"><input id="din" placeholder="Dicter un imprévu, une tâche…" autocomplete="off" enterkeyhint="send"><button type="submit" aria-label="Envoyer">↑</button></form>
</div>
<nav class="tabs">
  <button class="on" onclick="go('jour',this)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Jour</button>
  <button onclick="go('semaine',this)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M9 9v12M15 9v12"/></svg>Semaine</button>
  <button onclick="go('bilan',this)"><svg viewBox="0 0 24 24"><path d="M4 19h16M7 16v-5M12 16V7M17 16v-9"/></svg>Bilan</button>
  <button onclick="go('reglages',this)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Réglages</button>
</nav>
<!-- sous-page (réglages) -->
<div class="pg" id="pg">
  <div class="navbar"><div class="l"><button class="nb b" onclick="closePage()" id="pgback">Réglages</button></div><div class="t" id="pgt"></div><div class="r"></div></div>
  <main id="pgm"></main>
</div>
<div class="sheet" id="sheet" onclick="if(event.target===this)sheetPick('close')"><div class="in">
  <div class="g"><div class="h" id="shtitle"></div><button onclick="sheetPick('done')">Fait</button><button class="red" onclick="sheetPick('skip')">Sauté</button><button onclick="sheetPick('none')">Effacer le statut</button></div>
  <div class="g"><button class="b" onclick="sheetPick('close')">Annuler</button></div>
</div></div>
<script src="planner.js"></script>
<script>
// ====================== état ======================
const P = Planner, MIN = 60000;
const LS = k => { try { return JSON.parse(localStorage.getItem('jour.' + k)); } catch (e) { return null; } };
const SV = (k, v) => { try { localStorage.setItem('jour.' + k, JSON.stringify(v)); } catch (e) { } };
const uid = () => Math.random().toString(36).slice(2, 9);
const DEFAULT_CFG = {
  wake: '08:00', bed: '00:00', windDown: 30, travelAfter: 30, travelBefore: 0,
  routines: [{ name: 'Dîner', start: '19:30', dur: 45 }],
  projects: [
    { id: 'libre', name: 'Libre', kind: 'libre', min: 90, color: '#8E8E93', gcolor: '8' },
    { id: 'poker', name: 'Poker', kind: 'daily', min: 60, max: 60, color: '#FF9500', gcolor: '5', notBefore: '18:00' },
    { id: 'geomind', name: 'GeoMind', kind: 'fill', max: 300, chunk: 120, minBlock: 45, color: '#007AFF', gcolor: '9' },
    { id: 'sport', name: 'Sport', kind: 'daily', min: 45, max: 45, color: '#34C759', gcolor: '10', off: true },
  ],
  google: { clientId: '1040783596085-q4q8issud4o96n1d46ncvhgjnq82ad8h.apps.googleusercontent.com', sourceCals: [], planCal: '', authUrl: 'https://jour-auth.andrea-schwertz2008.workers.dev', authKey: '' },
};
let cfg = Object.assign({}, DEFAULT_CFG, LS('cfg') || {});
if (!cfg.google.clientId) cfg.google.clientId = DEFAULT_CFG.google.clientId;
if (!cfg.google.authUrl) cfg.google.authUrl = DEFAULT_CFG.google.authUrl;
if (!cfg.mig2) { // migration : plus de déjeuner, trajet après les cours, poker le soir
  cfg.routines = (cfg.routines || []).filter(r => r.name !== 'Déjeuner');
  if (cfg.travelAfter == null) cfg.travelAfter = 30;
  const pk = (cfg.projects || []).find(p => p.id === 'poker'); if (pk && !pk.notBefore) pk.notBefore = '18:00';
  cfg.mig2 = true; try { localStorage.setItem('jour.cfg', JSON.stringify(cfg)); } catch (e) { }
}
let tasks = LS('tasks') || [];
let extras = LS('extras') || [];
let overrides = LS('overrides') || {};
let status = LS('status') || {};
let plan = LS('plan') || {};
let events = LS('events') || { fetchedAt: 0, items: [], cals: [] };
let gtok = LS('gtoken') || null;
let viewDate = null, pending = null, curView = 'jour';
const saveAll = () => { SV('cfg', cfg); SV('tasks', tasks); SV('extras', extras); SV('overrides', overrides); SV('status', status); SV('plan', plan); };

// ====================== planification ======================
function todayStr() { return Object.keys(P.planWeek({ cfg, now: Date.now(), events: [], extras: [], tasks: [], overrides: {} }, 1))[0]; }
function replan() {
  const now = Date.now();
  const ctx = { cfg, now, events: events.items.map(e => ({ s: e.s, e: e.e, title: e.title })), extras, tasks, overrides };
  const fresh = P.planWeek(ctx, 7);
  const today = Object.keys(fresh)[0];
  for (const ds of Object.keys(fresh)) {
    const old = plan[ds];
    if (ds === today && old) {
      const past = old.blocks.filter(b => b.s < now).map(b => b.e > now ? Object.assign({}, b, { e: Math.ceil(now / (5 * MIN)) * 5 * MIN }) : b).filter(b => b.e > b.s);
      fresh[ds].blocks = past.concat(fresh[ds].blocks.filter(b => b.s >= now)).sort((a, b) => a.s - b.s);
    }
  }
  for (const ds of Object.keys(plan)) if (ds < today && ds >= P.ymd(P.addDays(new Date(now), -21))) fresh[ds] = plan[ds];
  plan = fresh;
  SV('plan', plan); SV('lastPlan', now);
  if (!viewDate || !plan[viewDate]) { const ks = Object.keys(fresh).sort(); viewDate = (plan[today].window.end > now) ? today : ks[ks.indexOf(today) + 1] || today; }
  const cut = P.ymd(P.addDays(new Date(now), -21));
  for (const k of Object.keys(status)) if (k.slice(0, 10) < cut) delete status[k];
}
const bkey = b => b.date + '|' + b.s + '|' + (b.ref || b.title);

// ====================== rendu ======================
const fmt = t => { const x = new Date(t); return P.pad(x.getHours()) + ':' + P.pad(x.getMinutes()); };
const dur = (s, e) => { const m = Math.round((e - s) / MIN); return m >= 60 ? Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + P.pad(m % 60) : '') : m + ' min'; };
const dlong = ds => new Date(ds + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const dshort = ds => new Date(ds + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric' });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const proj = id => (cfg.projects || []).find(p => p.id === id);
const KINDS = { libre: 'Temps libre', daily: 'Quotidien', fill: 'Remplissage' };

function render() { renderHeader(); renderDay(); renderWeek(); renderBilan(); if (curView === 'reglages') renderSettings(); }
function renderHeader() {
  const b = document.getElementById('gbtn');
  if (tokenOk()) b.textContent = events.fetchedAt ? 'Actualiser' : 'Lire l\'agenda';
  else if (hasAuthService()) b.textContent = authState === 'login' ? 'Connecter' : (authState === 'réseau' ? 'Hors ligne' : 'Google');
  else b.textContent = 'Google';
}
function renderDay() {
  const day = plan[viewDate]; const tl = document.getElementById('tl'); const now = Date.now();
  const isToday = viewDate === todayStr();
  document.getElementById('dlabel').textContent = isToday ? 'Aujourd\'hui' : dlong(viewDate);
  document.getElementById('dfoot').textContent = '';
  if (!day) { tl.innerHTML = '<div class="empty">Rien de planifié.</div>'; document.getElementById('dmeta').textContent = ''; return; }
  const work = day.blocks.filter(b => b.kind !== 'libre').reduce((a, b) => a + (b.e - b.s), 0);
  const libre = day.blocks.filter(b => b.kind === 'libre').reduce((a, b) => a + (b.e - b.s), 0);
  document.getElementById('dmeta').textContent = (isToday ? dlong(viewDate).replace(/^./, c => c.toUpperCase()) + ' · ' : '') + dur(0, work) + ' de travail · ' + dur(0, libre) + ' libre · coucher ' + fmt(day.window.end + cfg.windDown * MIN);
  const items = day.fixed.map(f => Object.assign({ fixed: true }, f)).concat(day.blocks.map(b => Object.assign({ date: viewDate }, b))).sort((a, b) => a.s - b.s);
  let html = '', nowDone = false;
  for (const it of items) {
    if (!nowDone && isToday && it.s > now && now >= day.window.start) { html += '<div class="now"></div>'; nowDone = true; }
    const tm = '<div class="tm tnum"><b>' + fmt(it.s) + '</b>' + fmt(it.e) + '</div>';
    if (it.fixed) { html += '<div class="ev fx' + (it.kind === 'fixed' ? ' cal' : it.kind === 'imprevu' ? ' imp' : '') + '">' + tm + '<div class="bar"></div><div class="bd"><div class="n">' + esc(it.title) + '</div><div class="s">' + ({ fixed: 'Emploi du temps · fixe', routine: 'Routine', imprevu: 'Imprévu', trajet: 'Retour / trajet' }[it.kind]) + ' · ' + dur(it.s, it.e) + '</div></div></div>'; continue; }
    const k = bkey(it), st = status[k], cur = now >= it.s && now < it.e;
    const stHtml = st === 'done' ? '<span class="st done">Fait</span>' : st === 'skip' ? '<span class="st skip">Sauté</span>' : (it.e <= now ? '<span class="st ask">À renseigner</span>' : (cur ? '<span class="st cur">En cours</span>' : ''));
    const color = it.color || (proj(it.ref) || {}).color || (it.kind === 'task' ? 'var(--red)' : 'var(--blue)');
    html += '<button class="ev" onclick="tapBlock(\'' + k + '\')">' + tm + '<div class="bar" style="background:' + color + '"></div><div class="bd"><div class="n">' + esc(it.title) + '</div><div class="s">' + dur(it.s, it.e) + (it.kind === 'task' ? ' · Échéance' : '') + '</div></div>' + stHtml + '</button>';
  }
  tl.innerHTML = html || '<div class="empty">Journée vide.</div>';
  if (isToday && now > day.window.end && !day.blocks.some(b => b.e > now)) document.getElementById('dfoot').textContent = 'Journée terminée. Coucher prévu à ' + fmt(day.window.end + cfg.windDown * MIN) + '.';
  if (day.off) document.getElementById('dfoot').innerHTML = 'Journée sans rien de prévu. <a href="#" style="color:var(--blue);text-decoration:none" onclick="delete overrides[viewDate].off;saveAll();replan();saveAll();render();sync();return false">Replanifier cette journée</a>';
}
function renderWeek() {
  const el = document.getElementById('wk'); const days = Object.keys(plan).filter(d => d >= todayStr()).sort();
  el.innerHTML = days.map(ds => {
    const d = plan[ds]; const per = {}; const order = [];

function renderBilan() {

    '<div class="hd">Par projet</div><div class="grp">' + rows + '</div><div class="ft">Un bloc passé sans réponse n\'est pas compté. Touche-le dans Jour pour indiquer Fait ou Sauté.</div>';
}

function setStatus(k, st) {

  const prev = status[k]; const m = (b.e - b.s) / MIN;
  if (b.kind === 'task') { const t = tasks.find(t => t.id === b.ref); if (t) { if (prev === 'done') t.doneMin = Math.max(0, (t.doneMin || 0) - m); if (st === 'done') t.doneMin = (t.doneMin || 0) + m; t.done = t.doneMin >= t.minutes; } }
  if (st) status[k] = st; else delete status[k];
  saveAll(); replan(); saveAll(); render(); sync();
}
let need = null, held = []; // question en attente ("combien de temps ?") et ordres compris mais pas encore validés
function onDictate(ev) {
  ev.preventDefault();
  const inp = document.getElementById('din'); const text = inp.value.trim(); if (!text) return false;
  const ctx = { cfg, now: Date.now(), tasks, need };
  let acts = need && P.findDuration(text) != null ? [P.parse(text, ctx)] : P.parseAll(text, ctx);
  acts = held.concat(acts); held = [];
  pending = acts;
  const ok = acts.filter(a => a.action !== 'unknown' && a.action !== 'need');
  const asks = acts.filter(a => a.action === 'need');
  const bad = acts.filter(a => a.action === 'unknown');
  const lines = [];
  for (const a of ok) lines.push('• ' + a.summary);
  for (const a of asks) lines.push('? ' + a.summary);
  for (const a of bad) lines.push('✕ Pas compris : « ' + a.text + ' »');
  const c = document.getElementById('confirm'); const p = document.getElementById('ctext');
  p.innerHTML = lines.map(esc).join('<br>') + (bad.length && !ok.length && !asks.length ? '<br><span style="color:var(--sec)">Un ordre par phrase : « dentiste demain de 14h à 16h », « rien jusqu\'à samedi », « samedi révisions 4h », « pas fait poker », « coucher 1h ».</span>' : '');
  c.classList.add('on');
  const btns = c.querySelectorAll('.bt button');
  btns[1].style.display = ok.length ? '' : 'none';
  btns[1].textContent = asks.length && ok.length ? 'Valider sans ça' : 'Valider';
  btns[0].textContent = ok.length ? 'Annuler' : 'OK';
  need = asks.length ? asks[0] : null;
  if (asks.length) { held = ok; inp.value = ''; inp.placeholder = 'Réponds ici (ex : 4h)'; inp.focus(); } else inp.blur();
  return false;
}
function cancelAction() { pending = null; need = null; held = []; document.getElementById('confirm').classList.remove('on'); document.getElementById('din').placeholder = 'Dicter un imprévu, une tâche…'; }
function applyAction() {
  const acts = pending; if (!acts) return;
  cancelAction(); document.getElementById('din').value = '';
  const now = Date.now(); const today = todayStr(); let statusMsg = null;
  for (const a of acts) {
    if (a.action === 'extra') extras.push({ id: uid(), date: a.date, s: a.s, e: a.e, title: a.title });
    else if (a.action === 'task') tasks.push({ id: uid(), name: a.title, minutes: a.minutes, deadline: a.deadline, from: a.from || null, doneMin: 0 });
    else if (a.action === 'off') for (const ds of a.dates) { overrides[ds] = overrides[ds] || {}; overrides[ds].off = true; }
    else if (a.action === 'override') { overrides[a.date] = overrides[a.date] || {}; if (a.field === 'skip') overrides[a.date].skip = (overrides[a.date].skip || []).concat([a.value]); else overrides[a.date][a.field] = a.value; }
    else if (a.action === 'done' || a.action === 'skip') {
      const d = plan[today]; if (!d) continue;
      let cands = d.blocks.filter(b => b.kind !== 'libre');
      if (a.target) cands = cands.filter(b => b.ref === a.target.id);
      let b = cands.filter(b => b.s <= now).pop() || cands[0];
      if (!b) { toast('Aucun bloc trouvé'); continue; }
      const k = bkey(Object.assign({ date: today }, b));
      if (a.action === 'skip' && b.e > now) b.e = Math.max(b.s + 5 * MIN, Math.floor(now / (5 * MIN)) * 5 * MIN);
      const m = (b.e - b.s) / MIN; const prev = status[k];
      if (b.kind === 'task') { const t = tasks.find(t => t.id === b.ref); if (t) { if (prev === 'done') t.doneMin = Math.max(0, (t.doneMin || 0) - m); if (a.action === 'done') t.doneMin = (t.doneMin || 0) + m; t.done = t.doneMin >= t.minutes; } }
      status[k] = a.action; statusMsg = a.action === 'done' ? 'Noté : fait' : 'Noté : sauté';
    }
  }
  saveAll(); replan(); saveAll(); render(); sync(); toast(statusMsg || 'Replanifié');
}

}
function closePage() { document.getElementById('pg').classList.remove('on'); if (pageCtx) { pageCtx = null; saveAll(); replan(); saveAll(); renderSettings(); sync(); } }
function toggleCal(id) { const a = cfg.google.sourceCals; cfg.google.sourceCals = a.includes(id) ? a.filter(x => x !== id) : a.concat([id]); saveAll(); }
function exportData() {
  const txt = JSON.stringify({ cfg, tasks, extras, overrides, status, plan });
  navigator.clipboard.writeText(txt).then(() => toast('Sauvegarde copiée. Colle-la dans une note.')).catch(() => toast('Copie impossible ici'));
}
function importData() {
  const txt = prompt('Colle la sauvegarde :'); if (!txt) return;
  try { const d = JSON.parse(txt); cfg = Object.assign({}, DEFAULT_CFG, d.cfg || {}); tasks = d.tasks || []; extras = d.extras || []; overrides = d.overrides || {}; status = d.status || {}; plan = d.plan || {}; saveAll(); location.reload(); } catch (e) { toast('Sauvegarde invalide'); }
}

// ====================== Google Calendar ======================
const SCOPE = 'https://www.googleapis.com/auth/calendar';
const API = 'https://www.googleapis.com/calendar/v3';
function tokenOk() { return gtok && gtok.exp > Date.now() + 30000; }
let authState = '';
function hasAuthService() { return !!(cfg.google.authUrl && cfg.google.authKey); }
function loginLink() { return (cfg.google.authUrl || '').replace(/\/$/, '') + '/login?key=' + encodeURIComponent(cfg.google.authKey || ''); }
async function ensureToken() {
  if (tokenOk()) return true;
  if (!hasAuthService()) return false;
  try {
    const r = await fetch(cfg.google.authUrl.replace(/\/$/, '') + '/token', { headers: { 'X-Key': cfg.google.authKey } });
    const j = await r.json();
    if (j.token) { gtok = { token: j.token, exp: j.exp }; SV('gtoken', gtok); authState = ''; renderHeader(); return true; }
    authState = j.login ? 'login' : (j.error || 'erreur'); renderHeader(); return false;
  } catch (e) { authState = 'réseau'; renderHeader(); return false; }
}
function onChip() {
  if (tokenOk()) return refreshEvents(true).then(ok => ok && toast('Agenda à jour'));
  if (hasAuthService()) { if (authState === 'login') window.open(loginLink(), '_blank'); else ensureToken().then(ok => ok ? refreshEvents(true) : toast('Connexion impossible : ' + (authState || 'réessaie'))); return; }
  go('reglages'); openPage('google');
}
function grabToken() {
  const h = location.hash; if (!h || h.indexOf('access_token') < 0) return false;
  const p = new URLSearchParams(h.slice(1));
  gtok = { token: p.get('access_token'), exp: Date.now() + (+p.get('expires_in') || 3600) * 1000 }; SV('gtoken', gtok);
  history.replaceState(null, '', location.pathname.replace(/index\.html$/, '')); return true;
}
async function gfetch(path, opts) {
  if (!tokenOk()) await ensureToken();
  if (!tokenOk()) throw new Error('token');
  const r = await fetch(API + path, Object.assign({ headers: { Authorization: 'Bearer ' + gtok.token, 'Content-Type': 'application/json' } }, opts || {}));
  if (r.status === 401) { gtok = null; SV('gtoken', null); renderHeader(); throw new Error('token'); }
  if (r.status === 204) return null;
  const j = await r.json(); if (!r.ok) throw new Error(j.error && j.error.message || r.status); return j;
}
async function loadCals() {
  const j = await gfetch('/users/me/calendarList'); events.cals = (j.items || []).map(c => ({ id: c.id, summary: c.summary, primary: !!c.primary }));
  if (!cfg.google.sourceCals.length) { const pr = events.cals.find(c => c.primary); if (pr) cfg.google.sourceCals = [pr.id]; }
  const pl = events.cals.find(c => c.summary === 'Planning'); if (pl && !cfg.google.planCal) cfg.google.planCal = pl.id;
  SV('events', events); saveAll();
}
async function createPlanCal() {
  try { const j = await gfetch('/calendars', { method: 'POST', body: JSON.stringify({ summary: 'Planning', timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone }) }); cfg.google.planCal = j.id; saveAll(); await loadCals(); toast('Agenda Planning créé'); } catch (e) { toast('Erreur : ' + e.message); }
}
async function refreshEvents(force) {
  if (!tokenOk() && !(await ensureToken())) { renderHeader(); return false; }
  if (!force && Date.now() - events.fetchedAt < 20 * MIN) return true;
  try {
    if (!events.cals || !events.cals.length) await loadCals();
    const tmin = new Date(); tmin.setHours(0, 0, 0, 0); const tmax = new Date(tmin.getTime() + 9 * 86400000);
    const items = [];
    for (const cid of cfg.google.sourceCals) {
      if (cid === cfg.google.planCal) continue;
      const j = await gfetch('/calendars/' + encodeURIComponent(cid) + '/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin=' + encodeURIComponent(tmin.toISOString()) + '&timeMax=' + encodeURIComponent(tmax.toISOString()));
      for (const e of (j.items || [])) {
        if (!e.start || !e.start.dateTime || e.transparency === 'transparent' || e.status === 'cancelled') continue;
        items.push({ s: new Date(e.start.dateTime).getTime(), e: new Date(e.end.dateTime).getTime(), title: e.summary || '(sans titre)', cal: cid });
      }
    }
    events.items = items; events.fetchedAt = Date.now(); SV('events', events);
    replan(); saveAll(); render(); sync(); return true;
  } catch (e) { toast('Agenda : ' + e.message); renderHeader(); return false; }
}
let syncing = false;
async function sync() {
  if (!cfg.google.planCal || syncing) return;
  if (!tokenOk() && !(await ensureToken())) return;
  syncing = true;
  try {
    const now = Date.now(); const tmax = now + 8 * 86400000;
    const want = {};
    for (const ds of Object.keys(plan)) for (const b of plan[ds].blocks) if (b.s >= now && b.s < tmax) {
      const p = proj(b.ref);
      want[b.s + '|' + b.e + '|' + b.title] = { summary: b.title, start: { dateTime: new Date(b.s).toISOString() }, end: { dateTime: new Date(b.e).toISOString() }, colorId: (p && p.gcolor) || (b.kind === 'task' ? '11' : '9'), extendedProperties: { private: { jour: '1' } }, reminders: { useDefault: false, overrides: b.kind === 'libre' ? [] : [{ method: 'popup', minutes: 0 }] } };
    }
    for (const x of extras) if (x.s >= now && x.s < tmax) want[x.s + '|' + x.e + '|' + x.title] = { summary: x.title, start: { dateTime: new Date(x.s).toISOString() }, end: { dateTime: new Date(x.e).toISOString() }, colorId: '6', extendedProperties: { private: { jour: '1' } } };
    const cal = encodeURIComponent(cfg.google.planCal);
    const j = await gfetch('/calendars/' + cal + '/events?privateExtendedProperty=jour%3D1&singleEvents=true&maxResults=500&timeMin=' + encodeURIComponent(new Date(now).toISOString()) + '&timeMax=' + encodeURIComponent(new Date(tmax).toISOString()));
    const have = {};
    for (const e of (j.items || [])) { if (e.status === 'cancelled' || !e.start.dateTime) continue; const k = new Date(e.start.dateTime).getTime() + '|' + new Date(e.end.dateTime).getTime() + '|' + e.summary; if (have[k]) await gfetch('/calendars/' + cal + '/events/' + e.id, { method: 'DELETE' }); else have[k] = e.id; }
    for (const k of Object.keys(have)) if (!want[k]) await gfetch('/calendars/' + cal + '/events/' + have[k], { method: 'DELETE' });
    for (const k of Object.keys(want)) if (!have[k]) await gfetch('/calendars/' + cal + '/events', { method: 'POST', body: JSON.stringify(want[k]) });
    SV('lastSync', Date.now());
  } catch (e) { if (e.message !== 'token') toast('Synchronisation : ' + e.message); }
  syncing = false; renderHeader();
}

// ====================== démarrage ======================
(async function init() {
  const fresh = grabToken();
  if (location.hash === '#connected') { history.replaceState(null, '', location.pathname); gtok = null; toast('Google connecté'); }
  replan(); saveAll(); render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  if (fresh) { await loadCals().catch(() => { }); await refreshEvents(true); toast('Google connecté'); }
  else { if (!tokenOk()) await ensureToken(); await refreshEvents(false); }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (!tokenOk()) ensureToken().then(ok => { if (ok) refreshEvents(true); }); const last = LS('lastPlan') || 0; if (Date.now() - last > 30 * MIN) { replan(); saveAll(); render(); } refreshEvents(false); } });
  setInterval(() => { if (curView === 'jour') renderDay(); }, 60000);
})();
